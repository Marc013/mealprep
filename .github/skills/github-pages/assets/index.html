<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{SITE_TITLE}}</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Navigation -->
    <nav class="nav-bar">
        <div class="nav-brand">{{SITE_TITLE}}</div>
        <div class="nav-links">
            <a href="index.html" class="nav-link active">Overview</a>
            <a href="shopping.html" class="nav-link">Shopping</a>
        </div>
        <button class="nav-toggle" aria-label="Menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>
    </nav>

    <!-- Main Content -->
    <main class="container">
        <header class="hero">
            <h1 class="hero-title">{{HERO_TITLE}}</h1>
            <p class="hero-subtitle">{{HERO_SUBTITLE}}</p>
        </header>

        <!-- Overview Grid -->
        <section class="section">
            <h2 class="section-title">Overview</h2>
            <div class="card-grid" id="overview-grid">
                <!-- Cards populated by JavaScript -->
            </div>
        </section>

        <!-- Detail Section -->
        <section class="section">
            <h2 class="section-title">Details</h2>
            <div class="detail-list" id="detail-list">
                <!-- Details populated by JavaScript -->
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; {{YEAR}} {{SITE_TITLE}}</p>
    </footer>

    <script src="app.js"></script>
    <script>
        // Initialize with data
        document.addEventListener('DOMContentLoaded', () => {
            App.init('data/content.json');
        });
    </script>
</body>

</html>
