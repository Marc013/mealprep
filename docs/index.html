<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STRONGMAN MEALPREP</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Navigation -->
    <nav class="nav-bar">
        <div class="nav-brand">MEALPREP</div>
        <div class="nav-links">
            <a href="index.html" class="nav-link active">Dagplan</a>
            <a href="shopping.html" class="nav-link">Boodschappen</a>
        </div>
        <button class="nav-toggle" aria-label="Menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>
    </nav>

    <!-- Main Content -->
    <main class="container">
        <!-- Weekplan Selector -->
        <section class="weekplan-selector">
            <label class="selector-label">WEEKPLAN</label>
            <select id="weekplan-select" class="weekplan-select">
                <!-- Populated by JS -->
            </select>
        </section>

        <!-- Day Type Toggle -->
        <div class="day-toggle">
            <button class="toggle-btn active" data-type="training">TRAINING</button>
            <button class="toggle-btn" data-type="rest">RUST</button>
        </div>

        <!-- Day Totals -->
        <section class="day-totals">
            <div class="totals-header">
                <h2 class="totals-title">DAGTOTAAL</h2>
                <span class="totals-label" id="day-type-label">TRAININGSDAG</span>
            </div>
            <div class="macro-grid" id="day-macros">
                <!-- Populated by JS -->
            </div>
            <div class="targets-row" id="targets-row">
                <!-- Target indicators -->
            </div>
        </section>

        <!-- Schedule -->
        <section class="schedule" id="schedule">
            <!-- Meal cards populated by JS -->
        </section>
    </main>

    <!-- Recipe Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="recipe-modal">
            <button class="modal-close" id="modal-close">&times;</button>
            <div class="modal-content" id="modal-content">
                <!-- Recipe details -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            MealApp.init();
        });
    </script>
</body>

</html>
